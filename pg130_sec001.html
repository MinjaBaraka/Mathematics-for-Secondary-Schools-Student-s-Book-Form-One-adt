<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container opacity-0" data-reader-layout="standard"><section data-section-type="text_and_single_image" data-section-id="pg130_sec001" class="mx-auto w-full max-w-5xl bg-sky-50 px-8 py-8 text-slate-900 max-lg:px-6 max-sm:px-5" data-book-page="text_and_single_image" data-book-padding=""><div class="space-y-6" data-book-stack=""><article data-book-box="" data-book-surface="blue"><div data-book-padding="" data-book-surface="blue-bar"><h2 class="adt-h3" data-learning-heading="example"><span data-id="pg130_n0003">Example 6.5</span></h2></div><div data-book-padding="" class="space-y-3" data-book-stack=""><p class="adt-body"><span data-id="pg130_n0005">Find the gradient of a straight line given in the following figure.</span></p><figure><img style="display:block;width:min(100%,30rem);height:auto;margin:1rem auto" data-id="pg130_im002_figure1" src="images/pg130_im002_figure1.png" alt="Coordinate graph of the line through P (-3, 5) and Q (0, 1)." ></figure><h3 class="adt-h3" data-book-heading="solution" data-book-ink="blue"><span data-id="pg130_n0007">Solution</span></h3><p class="adt-body"><span data-id="pg130_n0009">Given points P(−3, 5) and Q(0, 1).</span> <span data-id="pg130_n0010">Let <math displaystyle="true"><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mo form="prefix" stretchy="false">−</mo><mn>3</mn><mo separator="true">,</mo><mn>5</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></math> and <math displaystyle="true"><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msub><mi>x</mi><mn>2</mn></msub><mo separator="true">,</mo><msub><mi>y</mi><mn>2</mn></msub><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></math>.</span></p><p class="adt-body"><span data-id="pg130_n0012">From, <math displaystyle="true"><mrow><mi>m</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msub><mi>y</mi><mn>2</mn></msub><mo>−</mo><msub><mi>y</mi><mn>1</mn></msub></mrow><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>−</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfrac></mstyle></mrow></math>, it follows that,</span></p><p class="adt-body"><span data-id="pg130_n0013"><math displaystyle="true"><mrow><mi>m</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn><mo>−</mo><mn>5</mn></mrow><mrow><mn>0</mn><mo>−</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mo form="prefix" stretchy="false">−</mo><mn>3</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></mfrac></mstyle></mrow></math></span></p><p class="adt-body"><span data-id="pg130_n0014"><math displaystyle="true"><mrow><mo>=</mo><mo form="prefix" stretchy="false">−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></math></span></p><p class="adt-body"><span data-id="pg130_n0016">Therefore, the gradient of a line PQ is <math displaystyle="true"><mrow><mo form="prefix" stretchy="false">−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></math>.</span></p></div></article></div></section></div>
