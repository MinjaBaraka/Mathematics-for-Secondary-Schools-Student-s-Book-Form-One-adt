    <h1 data-id="pg130_n0003" data-learning-heading="example" class="adt-h3 book-revealed-title">Example 6.5</h1>
  </div>

  <p class="adt-body mb-6 leading-relaxed"><span data-id="pg130_n0005">Find the gradient of a straight line given in the following figure.</span></p>

  <div class="mb-8 overflow-hidden rounded-xl border border-sky-200 bg-white shadow-sm" data-book-box="">
    <img data-id="pg130_im002_figure1" src="images/pg130_im002_figure1.png" alt="Coordinate graph of the line through P (-3, 5) and Q (0, 1)." class="book-content-figure">
  </div>

  <div class="rounded-xl border border-sky-200 bg-white/80 px-6 py-6 shadow-sm max-sm:px-4" data-book-box="" data-book-padding="">
    <div class="mb-3">
      <h3 class="adt-h3 font-semibold text-sky-700" data-id="pg130_n0007" data-book-heading="solution" data-book-ink="blue">Solution</h3>
    </div>

    <p class="adt-body mb-4 leading-relaxed"><span data-id="pg130_n0009">Given points P(&#x2212;3, 5) and Q(0, 1).</span></p>
    <p class="adt-body mb-6 leading-relaxed"><span data-id="pg130_n0010">Let $(x_1, y_1) = (&#x2212;3, 5)$ and <math><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msub><mi>x</mi><mn>2</mn></msub><mo separator="true">,</mo><msub><mi>y</mi><mn>2</mn></msub><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></math>.</span></p>

    <p class="adt-body mb-4 leading-relaxed"><span data-id="pg130_n0012">From, <math><mrow><mi>m</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msub><mi>y</mi><mn>2</mn></msub><mo>−</mo><msub><mi>y</mi><mn>1</mn></msub></mrow><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>−</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfrac></mstyle></mrow></math>, it follows that,</span></p>

    <div class="mb-2 pl-12 max-sm:pl-4">
      <div class="adt-body leading-relaxed" data-id="pg130_n0013">m = \dfrac{1 - 5}{0 - (&#x2212;3)}</div>
    </div>
    <div class="mb-6 pl-12 max-sm:pl-4">
      <div class="adt-body leading-relaxed" data-id="pg130_n0014"><math><mrow><mo>=</mo><mo form="prefix" stretchy="false">−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></math></div>
    </div>

    <p class="adt-body leading-relaxed"><span data-id="pg130_n0016">Therefore, the gradient of a line PQ is <math><mrow><mo form="prefix" stretchy="false">−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></math>.</span></p>
  </div>
