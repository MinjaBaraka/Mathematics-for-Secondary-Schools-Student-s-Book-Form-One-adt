  <div class="rounded-2xl border border-sky-200 bg-sky-50 p-4" data-book-box="" data-book-padding="" data-book-surface="blue" data-reader-region=""><figure class="book-number-line-pair"><p class="adt-body"><span data-id="pg036_n0004">(b)</span> <span class="sr-only" data-id="pg036_n0005"><math><mrow><mi>x</mi><mo>≤</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></mrow></math></span></p><img src="images/pg036-2-16-b.png" class="book-source-number-line" style="--book-figure-width: 327px;" alt="Ray extending left from a closed point at three halves."><p class="adt-body"><span data-id="pg036_n0006">(c)</span> <span class="sr-only" data-id="pg036_n0007"><math><mrow><mo form="prefix" stretchy="false">−</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>&lt;</mo><mi>x</mi><mo>≤</mo><mn>2</mn></mrow></math></span></p><img src="images/pg036-2-16-c.png" class="book-source-number-line" style="--book-figure-width: 327px;" alt="Interval from negative five thirds, excluded, to two, included."><p class="adt-body"><span data-id="pg036_n0008">(d)</span> <span class="sr-only" data-id="pg036_n0009"><math><mrow><mi>x</mi><mo>≤</mo><mn>3</mn><mtext> or </mtext><mi>x</mi><mo>≥</mo><mn>3</mn></mrow></math></span></p><img src="images/pg036-2-16-d.png" class="book-source-number-line" style="--book-figure-width: 300px;" alt="Rays in both directions from the included point three."><figcaption class="sr-only" data-id="pg036_im004">Three number-line graphs: top, a closed dot at 3/2 with shading to the left for x less than or equal to 3/2; middle, an open dot at negative 5/3 and a closed dot at 2 with the segment between them for negative 5/3 less than x less than or equal to 2; bottom, a closed dot at 3 with arrows extending both left and right, showing x less than or equal to 3 or x greater than or equal to 3.</figcaption></figure></div>

      <p class="adt-body text-left text-slate-900"><span data-id="pg036_n0013">Write the inequalities represented by each of the following number lines.</span></p>

      <figure class="book-number-line-pair"><p class="adt-body"><span data-id="pg036_n0015">(a)</span></p><img src="images/pg036-2-17-a.png" class="book-source-number-line" style="--book-figure-width: 315px;" alt="Number line with closed endpoints at negative two and two."><p class="adt-body"><span data-id="pg036_n0016">(b)</span></p><img src="images/pg036-2-17-b.png" class="book-source-number-line" style="--book-figure-width: 339px;" alt="Number line with an open endpoint at negative eleven fourths and a closed endpoint at three halves."><span class="sr-only"><span data-id="pg036_n0017"><math><mrow><mo form="prefix" stretchy="false">−</mo><mfrac><mn>11</mn><mn>4</mn></mfrac></mrow></math></span> <span data-id="pg036_n0018"><math><mfrac><mn>3</mn><mn>2</mn></mfrac></math></span></span><p class="adt-body"><span data-id="pg036_n0019">(c)</span></p><img src="images/pg036-2-17-c.png" class="book-source-number-line" style="--book-figure-width: 320px;" alt="Ray to the left of negative one with an open endpoint and ray to the right of two with a closed endpoint."><p class="adt-body"><span data-id="pg036_n0020">(d)</span></p><img src="images/pg036-2-17-d.png" class="book-source-number-line" style="--book-figure-width: 418px;" alt="Number line with open endpoints at negative one and two."><figcaption class="sr-only" data-id="pg036_im005">Example 2.17 with four number-line graphs: (a) a segment from negative 2 to 2 with closed dots at both ends; (b) an open dot at negative 11/4 and a closed dot at 3/2 connected by a segment; (c) two rays, one extending left from an open dot at negative 1 and one extending right from a closed dot at 2; (d) a segment between open dots at negative 1 and 2.</figcaption></figure>
