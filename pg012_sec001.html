        <div class="practice-body">
          <div class="practice-panel activity-panel" role="group" aria-labelledby="activity-title">
            <h1 id="activity-title" class="adt-h3 practice-heading" data-learning-heading="activity"><span data-id="pg012_n0006"><span
                  class="activity-number">Activity 1.3:</span> Exploring the importance of Mathematics</span></h1>
            <div class="practice-panel-body">
              <p id="activity-instructions" class="adt-body"><span data-id="pg012_n0007">Use different sources such as
                  books and internet to explore the importance of Mathematics in daily life.</span></p>
              <label id="activity-response-label" class="practice-response-label" for="item-1">Your findings</label>
              <textarea id="item-1" data-activity-item="item-1"
                aria-labelledby="activity-instructions activity-response-label" class="practice-answer"
                rows="4" data-response-kind="activity"></textarea>
              <p id="practice-save-status" class="practice-status" role="status">Answers save on this device as you
                type.</p>
            </div>
          </div>
          <div class="practice-panel exercise-panel" role="group" aria-labelledby="exercise-title">
            <h2 id="exercise-title" class="adt-h3 practice-heading" data-learning-heading="exercise"><span data-id="pg012_n0010">Exercise 1.1</span></h2>
            <div class="practice-panel-body">
              <div class="practice-question-block">
                <label for="item-2" id="question-1" class="adt-body practice-question"><span data-id="pg012_n0011"><span
                      class="exercise-number">1.</span> What is Mathematics?</span></label>
                <textarea id="item-2" data-activity-item="item-2" aria-labelledby="question-1" class="practice-answer"
                  rows="2" data-response-kind="exercise"></textarea>
              </div>
              <div class="practice-question-block">
                <label for="item-3" id="question-2" class="adt-body practice-question"><span data-id="pg012_n0012"><span
                      class="exercise-number">2.</span> Explain five mathematical skills that are useful in your daily
                    life activities.</span></label>
                <textarea id="item-3" data-activity-item="item-3" aria-labelledby="question-2" class="practice-answer"
                  rows="4" data-response-kind="exercise"></textarea>
              </div>
              <div class="practice-question-block">
                <label for="item-4" id="question-3" class="adt-body practice-question"><span data-id="pg012_n0013"><span
                      class="exercise-number">3.</span> Choose any five subjects of your choice other than Mathematics
                    and explain with vivid examples how each of them is connected to Mathematics.</span></label>
                <textarea id="item-4" data-activity-item="item-4" aria-labelledby="question-3" class="practice-answer"
                  rows="5" data-response-kind="exercise"></textarea>
              </div>
              <div class="practice-question-block">
                <label for="item-5" id="question-4" class="adt-body practice-question"><span data-id="pg012_n0014"><span
                      class="exercise-number">4.</span> Write an essay arguing whether or not learning Mathematics is
                    important in our lives.</span></label>
                <textarea id="item-5" data-activity-item="item-5" aria-labelledby="question-4" class="practice-answer"
